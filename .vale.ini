StylesPath = styles
MinAlertLevel = warning

[formats]
tex = md

[*.md]
BasedOnStyles = jarl

# Rule files and skills follow language.md section 2 (STE).
[{CLAUDE.md,main.md,workflow.md,code-style.md,reporting.md,language.md,hooks.md,setup.md,**/SKILL.md}]
BasedOnStyles = jarl, STE

# LaTeX commands and math are markup, not prose.
[*.tex]
BasedOnStyles = jarl
TokenIgnores = (\$[^$]+\$), (\\\[[^]]*\\\]), (\\[a-zA-Z]+(\[[^]]*\])?)

# language.md names the bans it defines.
[{language.md,**/language.md}]
jarl.BannedWords = NO
jarl.Filler = NO
jarl.PerformedFeelings = NO
jarl.Teasers = NO
STE.Contractions = NO
STE.PassiveVoice = NO
