StylesPath = styles
MinAlertLevel = warning

[formats]
tex = md

[*.md]
BasedOnStyles = jarl

# LaTeX commands and math are markup, not prose.
[*.tex]
BasedOnStyles = jarl
TokenIgnores = (\$[^$]+\$), (\\\[[^]]*\\\]), (\\[a-zA-Z]+(\[[^]]*\])?)

# language.md defines the bans, so it names the banned things legitimately.
[language.md]
jarl.BannedWords = NO
jarl.Filler = NO
jarl.PerformedFeelings = NO
jarl.Teasers = NO
