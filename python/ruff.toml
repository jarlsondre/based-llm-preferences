line-length = 120
target-version = "py311"
# Migrations are generated code: not linted or formatted here.
extend-exclude = ["**/migrations"]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes: undefined names, unused imports, etc.
  "I",   # isort: import sorting
  "W",   # pycodestyle warnings
  "B",   # flake8-bugbear: likely bugs and bad practices (e.g. mutable defaults)
  "C4",  # flake8-comprehensions: unnecessary or suboptimal comprehensions
  "C901", # mccabe complexity: decompose the function; never noqa without asking jarl first
  "SIM", # flake8-simplify: redundant ifs, returns, boolean logic
  "UP",  # pyupgrade: use modern Python syntax (e.g. f-strings, `Path()` literals)
  "PTH", # flake8-use-pathlib: use pathlib instead of os.path
  "N",   # pep8-naming: naming conventions for classes, functions, variables
  "ANN", # flake8-annotations: require type annotations on functions
  "RET", # flake8-return: no else after return, clean return handling
  "PERF", # perflint: comprehensions and C-level calls over manual loops
  "FURB", # refurb: use the stdlib idiom
  "PLE", # pylint errors: real mistakes, near-zero noise
  "PLW1510", # subprocess.run without explicit check= fails silently
  "PLW2901", # loop variable overwritten inside the loop body
  "PLR1714", # merge repeated comparisons: x == 1 or x == 2 -> x in {1, 2}
  "PLC0414", # useless import alias
  "PLW0603", # no global statements mutating module state; prefer pure functions
  "BLE", # no blind except Exception: failures stay loud
  "S110", # no try-except-pass
  "S112", # no try-except-continue
  "ERA", # no commented-out code
  "ARG", # no unused function arguments (prefix with _ when required by an interface)
  "RUF", # ruff's own rules, including RUF100: no stale noqa comments
  "NPY", # numpy modernization, e.g. Generator API over np.random.seed
  "PD", # pandas-vet, e.g. no inplace=True
  "FIX", # no TODO/FIXME/HACK left in code: do it or move it to the backlog file
]
ignore = [
  "E203",   # Whitespace before ':': conflicts with the formatter
  "PTH109", # Allow os.getcwd()
  "PTH122", # Avoid replacing os.path.splitext: Path.suffix drops info (e.g. .tar.gz)
  "PTH123", # Allow use of builtin open(): Path.open() adds no real benefit
  "UP006",  # Keep using typing.List/Dict/Set: prefer consistency over builtin generics
  "UP035",  # Same as above: avoid auto-converting to list[]/dict[] syntax
  "B904",   # Don't require `from err` in CLI code: breaks Typer/Click behavior
  "SIM108", # Don't always use ternary operators: they can be kind of hard to read sometimes
  "N806",   # Allow UPPER_CASE_VARIABLE_NAMES in function scopes (for default values etc.)
  "N812",   # Allow importing stuff as uppercase (e.g. function as F)
]
fixable = ["ALL"]

[lint.per-file-ignores]
# Tests don't need full annotation coverage.
"**/tests.py" = ["ANN"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
