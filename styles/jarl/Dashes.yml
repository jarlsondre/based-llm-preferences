extends: existence
message: "em-dash or substitute (language.md): use a comma, colon, parentheses, or two sentences"
level: error
nonword: true
tokens:
  - '—'
  - ' – '
  - '[A-Za-z]--[A-Za-z]'
  - ' -- '
  # LaTeX em-dash; letters required on both sides so md front matter and
  # table rows stay safe.
  - '[A-Za-z] ?--- ?[A-Za-z]'
